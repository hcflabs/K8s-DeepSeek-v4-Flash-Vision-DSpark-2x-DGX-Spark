name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint chart -f chart/ci/test-values.yaml
      - name: helm template (defaults, ingress, auth variants)
        run: |
          V="-f chart/ci/test-values.yaml"
          helm template ci chart $V > /dev/null
          helm template ci chart $V --set 'ingress.hosts[0]=vllm.example.com' > /dev/null
          helm template ci chart $V --set auth.apiKey=test > /dev/null
          helm template ci chart $V --set weights.nfs.enabled=true --set weights.nfs.server=192.0.2.1 --set weights.nfs.path=/m > /dev/null
          if helm template ci chart > /dev/null 2>&1; then echo "chart must require site values"; exit 1; fi
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning chart/files/serve.sh chart/files/wait-for-worker.sh scripts/*.sh
      - name: embedded script syntax
        run: scripts/check-anchors.sh

  anchors:
    # Dry-runs every hotfix against the pinned image. Slow (arm64 under QEMU,
    # ~10 GB pull) but it is the only check that catches a moved anchor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: anchor check against the chart's image
        run: |
          IMAGE="$(helm show values chart >/dev/null; helm template ci chart -f chart/ci/test-values.yaml | awk '/^ +image: /{gsub(/"/,"",$2); print $2; exit}')"
          echo "image: ${IMAGE}"
          scripts/check-anchors.sh --image "${IMAGE}"
