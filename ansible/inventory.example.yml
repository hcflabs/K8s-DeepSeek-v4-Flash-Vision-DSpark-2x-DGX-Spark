---
# Copy to inventory.yml and edit. Sparks join an EXISTING k3s cluster as agents;
# there is deliberately no `server` group here - control-plane hosts are not
# managed by this playbook.
#
# Var names mirror the chart values (gpu_fabric_interface <-> topology.fabric.interface,
# gpu_fabric_rdma_device <-> topology.fabric.rdmaDevice, rank <-> topology.rankLabels).
all:
  vars:
    ansible_user: admin
    # Existing cluster: required inputs for the agent join.
    k3s_version: v1.xx.y+k3s1          # match the control plane
    api_endpoint: 192.0.2.10           # control-plane address (k3s-ansible joins to https://<api_endpoint>:6443)
    token: "{{ vault_k3s_token }}"     # from ansible/init-vault.sh
    # The k3s `prereq` role reads this for CIDRs; "{}" keeps the cluster defaults.
    server_config_yaml: "{}"

  children:
    k3s_cluster:
      children:
        # Intentionally empty: the k3s roles look the group up, but no host in it
        # means no control-plane component is ever installed by this playbook.
        server: {}
        agent:
          children:
            gpu:
              hosts:
                spark-leader:
                  ansible_host: 192.0.2.21
                  gpu_rank: leader                       # leader | worker
                  gpu_fabric_address: 198.51.100.1/30
                  gpu_fabric_peer: 198.51.100.2
                spark-worker:
                  ansible_host: 192.0.2.22
                  gpu_rank: worker
                  gpu_fabric_address: 198.51.100.2/30
                  gpu_fabric_peer: 198.51.100.1
              vars:
                gpu_fabric_interface: fabric0        # netdev of the cable between the nodes (ip -br link)
                gpu_fabric_rdma_device: rdma0     # its RDMA device (ls /sys/class/infiniband)
                # Must match the chart's topology.rankLabels.key.
                gpu_rank_label_key: node.dspark/rank
                gpu_models_dir: /data/models
                # Written to /etc/rancher/k3s/config.yaml BEFORE the agent registers:
                # labels and taint only apply at first registration.
                agent_config_yaml: |
                  node-label:
                    - "nvidia.com/gpu.present=true"
                    - "{{ gpu_rank_label_key }}={{ gpu_rank }}"
                  node-taint:
                    - "nvidia.com/gpu=present:NoSchedule"
