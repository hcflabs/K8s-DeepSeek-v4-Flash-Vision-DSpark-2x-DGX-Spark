apiVersion: v1
kind: Service
metadata:
  name: {{ include "dspark.fullname" . }}
  labels:
    {{- include "dspark.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dspark.selectorLabels" (dict "root" . "component" "leader") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
